<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" aria-hidden="true">
  <!-- A single chair silhouette under a hanging lightbulb — sparse, somber -->
  <!-- Ceiling line -->
  <line x1="20" y1="22" x2="180" y2="22" stroke="currentColor" stroke-width="1" opacity="0.3" />
  <!-- Bulb wire -->
  <line x1="100" y1="22" x2="100" y2="62" stroke="currentColor" stroke-width="1" opacity="0.5" />
  <!-- Lightbulb -->
  <circle cx="100" cy="72" r="10" stroke="#D64045" stroke-width="1.5" fill="rgba(214, 64, 69, 0.08)" />
  <line x1="96" y1="82" x2="104" y2="82" stroke="#D64045" stroke-width="1.5" />
  <line x1="97" y1="85" x2="103" y2="85" stroke="#D64045" stroke-width="1.5" />
  <!-- Light cone — faint glow -->
  <path d="M88 88 L70 178 L130 178 L112 88 Z" fill="#D64045" opacity="0.04" />
  <!-- Floor line -->
  <line x1="20" y1="178" x2="180" y2="178" stroke="currentColor" stroke-width="1" opacity="0.3" />
  <!-- Chair: simple wooden chair, line art -->
  <!-- Back -->
  <line x1="80" y1="118" x2="80" y2="160" stroke="currentColor" stroke-width="2" />
  <line x1="80" y1="118" x2="115" y2="118" stroke="currentColor" stroke-width="2" />
  <line x1="115" y1="118" x2="115" y2="160" stroke="currentColor" stroke-width="2" />
  <line x1="83" y1="128" x2="112" y2="128" stroke="currentColor" stroke-width="1" opacity="0.6" />
  <line x1="83" y1="138" x2="112" y2="138" stroke="currentColor" stroke-width="1" opacity="0.6" />
  <!-- Seat -->
  <line x1="78" y1="155" x2="125" y2="155" stroke="currentColor" stroke-width="2" />
  <!-- Front legs -->
  <line x1="80" y1="155" x2="80" y2="178" stroke="currentColor" stroke-width="2" />
  <line x1="125" y1="155" x2="125" y2="178" stroke="currentColor" stroke-width="2" />
  <!-- Back of seat to front -->
  <line x1="115" y1="160" x2="125" y2="155" stroke="currentColor" stroke-width="2" />
</svg>
