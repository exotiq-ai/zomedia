<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" aria-hidden="true">
  <!-- A pen tip drags an ink line that breaks THROUGH a brick wall -->
  <!-- Brick wall on the right side -->
  <g stroke="currentColor" stroke-width="1" opacity="0.35">
    <!-- Row 1 -->
    <rect x="115" y="40" width="35" height="14" />
    <rect x="150" y="40" width="35" height="14" />
    <!-- Row 2 (offset) -->
    <rect x="100" y="54" width="32" height="14" />
    <rect x="132" y="54" width="32" height="14" />
    <rect x="164" y="54" width="32" height="14" />
    <!-- Row 3 -->
    <rect x="115" y="68" width="35" height="14" />
    <rect x="150" y="68" width="35" height="14" />
    <!-- Row 4 (offset) -->
    <rect x="100" y="82" width="32" height="14" />
    <rect x="132" y="82" width="32" height="14" />
    <rect x="164" y="82" width="32" height="14" />
    <!-- Row 5 -->
    <rect x="115" y="96" width="35" height="14" />
    <rect x="150" y="96" width="35" height="14" />
    <!-- Row 6 (offset) -->
    <rect x="100" y="110" width="32" height="14" />
    <rect x="132" y="110" width="32" height="14" />
    <rect x="164" y="110" width="32" height="14" />
    <!-- Row 7 -->
    <rect x="115" y="124" width="35" height="14" />
    <rect x="150" y="124" width="35" height="14" />
    <!-- Row 8 (offset) -->
    <rect x="100" y="138" width="32" height="14" />
    <rect x="132" y="138" width="32" height="14" />
    <rect x="164" y="138" width="32" height="14" />
  </g>
  <!-- Broken brick wall edge — rough crack through middle row -->
  <path d="M100 96 L110 110 L100 124 L110 138" stroke="currentColor" stroke-width="2" opacity="0.5" />
  <!-- The pen line — starts top-left, sweeps right, breaks through the wall -->
  <path d="M15 130 Q50 90 90 110 Q105 116 130 116"
        stroke="#D64045" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <!-- Continuation past the wall, brighter -->
  <path d="M130 116 L165 116" stroke="#D64045" stroke-width="3" stroke-linecap="round" fill="none" />
  <!-- Splatter dot at the break point -->
  <circle cx="130" cy="116" r="3" fill="#D64045" />
  <!-- Pen body — angled, classic dip pen -->
  <line x1="0" y1="160" x2="15" y2="130" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
  <line x1="5" y1="155" x2="17" y2="132" stroke="currentColor" stroke-width="2" opacity="0.5" />
  <!-- Pen tip -->
  <circle cx="15" cy="130" r="2.5" fill="#D64045" />
</svg>
